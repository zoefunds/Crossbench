app = "crossbench-api"
primary_region = "ams"
[build]
  dockerfile = "Dockerfile"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
[processes]
  app = "node dist/server.js"
[env]
  APP_ORIGIN = "https://crossbench-app.vercel.app"
[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
